<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Contatos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="IconeListaDeContatos.ico" type="image/x-icon">
</head>
<body>

    <div id="toast" class="toast hidden"></div>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-address-book"></i> Agenda de Contatos</h1>
        </header>

        <main class="grid-layout">
            <section class="card">
                <h2 id="form-title"><i class="fa-solid fa-user-plus"></i> Novo Contato</h2>
                <form id="contact-form">
                    <input type="hidden" id="contact-id">
                    
                    <div class="input-group">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" placeholder="Maria Silva" required>
                    </div>

                    <div class="input-group">
                        <label for="telefone">Telefone *</label>
                        <input type="text" id="telefone" placeholder="(11) 99999-9999" maxlength="15" required>
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="maria@email.com">
                    </div>

                    <div class="input-group">
                        <label for="categoria">Categoria</label>
                        <select id="categoria">
                            <option value="Pessoal">Pessoal</option>
                            <option value="Trabalho">Trabalho</option>
                            <option value="Família">Família</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" id="btn-save" class="btn primary">Salvar</button>
                        <button type="button" id="btn-cancel" class="btn secondary hidden">Cancelar</button>
                    </div>
                </form>
            </section>

            <section>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Buscar por nome ou telefone...">
                </div>
                <div id="contacts-container" class="contacts-grid"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
